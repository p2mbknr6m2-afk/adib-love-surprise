<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Adib ❤️</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#ffe4ef,#ffc4dd,#fff2f8);font-family:Arial,sans-serif;color:#87244f;text-align:center}.card{background:#ffffffdc;border-radius:28px;padding:30px 22px;box-shadow:0 15px 45px #b64c7938;width:min(85vw,380px)}h1{font-size:30px}p{line-height:1.6}button{border:0;border-radius:50px;padding:14px 25px;margin:8px;font-size:17px;font-weight:bold;cursor:pointer}.yes{background:#e72f79;color:white}.no{background:#ffe2ec;color:#a82b5d}.small{font-size:12px;color:#a76580}.heart{font-size:55px;animation:beat 1.3s infinite}@keyframes beat{50%{transform:scale(1.15)}}#reply{font-size:20px;font-weight:bold;min-height:40px}</style></head><body><div class="card"><div class="heart">💖</div><h1>Adib, do you love me? ❤️</h1><p>My man, you make my world a little more beautiful. Love to see your smile. 🥹💕</p><p>Will you keep smiling with me?</p><form id="loveForm" action="https://formsubmit.co/eramoon251@gmail.com" method="POST"><input type="hidden" name="_subject" value="Adib's Love Surprise Answer"><input type="hidden" name="_captcha" value="true"><input type="hidden" name="From" value="Adib Love Surprise"><input type="hidden" name="Answer" id="chosenAnswer"><button class="yes" type="button" onclick="answer('Yes ❤️')">Yes ❤️</button><button class="no" type="button" onclick="answer('No 💔')">No 💔</button></form><p id="reply"></p><p class="small">Made with love, just for you 🌷</p></div><script>function answer(a){document.getElementById('chosenAnswer').value=a;document.getElementById('reply').textContent=a.startsWith('Yes')?'You made my heart smile! 🥰':'Thank you for being honest. 💗';if(confirm('Send your answer to Ira?'))document.getElementById('loveForm').submit();}</script></body></html>
